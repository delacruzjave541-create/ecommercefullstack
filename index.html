<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShopLab | Products</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ── Header ──────────────────────────────────────────────────── -->
  <header class="site-header">
    <div class="header-inner">
      <a class="logo" href="#">Shop<span>Lab</span></a>
      <nav class="nav-links">
        <a href="#">Home</a>
        <a href="#" class="active">Products</a>
        <a href="#">Orders</a>
      </nav>
      <div class="header-actions">
        <div class="search-bar">
          <input type="text" id="searchInput" placeholder="Search products…" />
          <button id="searchBtn">&#x2315;</button>
        </div>
        <button class="cart-btn" aria-label="Cart">
          🛒 <span class="cart-count">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- ── Filters ─────────────────────────────────────────────────── -->
  <section class="filter-bar">
    <div class="filter-inner">
      <div class="filter-group">
        <label for="categoryFilter">Category</label>
        <select id="categoryFilter">
          <option value="">All</option>
        </select>
      </div>
      <div class="filter-group">
        <label for="minPrice">Min Price (₱)</label>
        <input type="number" id="minPrice" placeholder="0" min="0" />
      </div>
      <div class="filter-group">
        <label for="maxPrice">Max Price (₱)</label>
        <input type="number" id="maxPrice" placeholder="9999" min="0" />
      </div>
      <button class="btn-filter" id="applyFilters">Apply</button>
      <button class="btn-filter btn-outline" id="resetFilters">Reset</button>
    </div>
  </section>

  <!-- ── Main Product Grid ────────────────────────────────────────── -->
  <main class="product-section">
    <div class="section-header">
      <h2>Products</h2>
      <span id="productCount" class="product-count"></span>
    </div>

    <!-- Loading skeleton -->
    <div id="loadingState" class="loading-grid" aria-live="polite">
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
    </div>

    <!-- Product cards inject here -->
    <div id="productGrid" class="product-grid" aria-live="polite"></div>

    <!-- Empty state -->
    <div id="emptyState" class="empty-state" hidden>
      <div class="empty-icon">📦</div>
      <h3>No products found</h3>
      <p>Try adjusting your filters or search term.</p>
      <button class="btn-filter" onclick="resetAndFetch()">Show all products</button>
    </div>

    <!-- Error state -->
    <div id="errorState" class="error-state" hidden>
      <div class="error-icon">⚠️</div>
      <h3 id="errorTitle">Something went wrong</h3>
      <p id="errorMessage">Could not load products.</p>
      <button class="btn-filter" onclick="fetchProducts()">Retry</button>
    </div>
  </main>

  <!-- ── Add Product Modal ────────────────────────────────────────── -->
  <button class="fab" id="fabBtn" title="Add product">＋</button>

  <div class="modal-overlay" id="modalOverlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-label="Add Product">
      <button class="modal-close" id="modalClose">✕</button>
      <h3>Add New Product</h3>
      <div class="form-group">
        <label for="pName">Name *</label>
        <input type="text" id="pName" required />
      </div>
      <div class="form-group">
        <label for="pDesc">Description</label>
        <textarea id="pDesc" rows="3"></textarea>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="pPrice">Price (₱) *</label>
          <input type="number" id="pPrice" min="0.01" step="0.01" required />
        </div>
        <div class="form-group">
          <label for="pStock">Stock *</label>
          <input type="number" id="pStock" min="0" required />
        </div>
      </div>
      <div class="form-group">
        <label for="pCategory">Category</label>
        <select id="pCategory">
          <option value="">— None —</option>
        </select>
      </div>
      <div class="form-group">
        <label for="pImage">Image URL</label>
        <input type="url" id="pImage" placeholder="https://…" />
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" id="btnCancel">Cancel</button>
        <button class="btn-submit" id="btnSubmit">Save Product</button>
      </div>
      <p id="formError" class="form-error" hidden></p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
