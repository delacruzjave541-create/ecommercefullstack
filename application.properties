# ==========================================
# Database Configuration – MySQL
# ==========================================
spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=yourpassword
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / Hibernate Configuration
# ==========================================
# "update" auto-creates/alters tables without dropping data
spring.jpa.hibernate.ddl-auto=update
# Print all generated SQL to the console for debugging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# MySQL 8 dialect
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ==========================================
# Server
# ==========================================
server.port=8080
